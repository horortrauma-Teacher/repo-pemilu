<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemilu ISMI & KGP - Daar el-Qolam 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Library Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .kandidat-card { transition: all 0.2s ease-in-out; }
        .kandidat-card.selected { border-color: #3b82f6; background-color: #eff6ff; transform: scale(1.05); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .kandidat-card:not(.selected):hover { border-color: #93c5fd; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col items-center py-10">

    <!-- HALAMAN LOGIN -->
    <div id="login-section" class="w-full max-w-md bg-white p-8 rounded-2xl shadow-lg border border-slate-100">
        <div class="text-center mb-6 flex flex-col items-center">
            <img src="logodarqo.png" alt="Logo Daar el-Qolam" class="w-24 h-auto mb-4" onerror="this.style.display='none'">
            <h1 class="text-2xl font-bold text-slate-800 leading-tight">Pemilihan Umum ISMI dan KGP</h1>
            <p class="text-slate-500 mt-2 font-medium">Daar el-Qolam 2</p>
        </div>
        
        <!-- Pilihan Kategori Putra/Putri -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-slate-700 mb-2">Pilih Kategori Pemilih</label>
            <select id="kategori-gender" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-lg font-medium">
                <option value="">-- Pilih Putra / Putri --</option>
                <option value="putra">Kandidat Putra</option>
                <option value="putri">Kandidat Putri</option>
            </select>
        </div>

        <!-- Pilihan ID -->
        <div class="mb-6">
            <label class="block text-sm font-medium text-slate-700 mb-2">Silakan pilih ID Anda (001 - 200)</label>
            <select id="voter-id" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-lg font-medium"></select>
        </div>
        
        <button onclick="login()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors shadow-md text-lg">
            Mulai Memilih
        </button>
        
        <div class="mt-8 pt-6 border-t border-slate-200 text-center">
            <button onclick="bukaAdmin()" class="text-sm text-slate-500 hover:text-slate-700 underline transition-colors">
                Akses Rekapan (Admin)
            </button>
        </div>
    </div>

    <!-- HALAMAN PEMILIHAN -->
    <div id="voting-section" class="hidden w-full max-w-4xl bg-white p-6 sm:p-8 rounded-2xl shadow-lg border border-slate-100 mx-4">
        <div class="flex justify-between items-center mb-8 border-b pb-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">Surat Suara Digital</h1>
                <p class="text-slate-500 text-sm mt-1" id="subtitle-voting">Silakan pilih kandidat Anda.</p>
            </div>
            <div class="bg-blue-50 text-blue-700 px-4 py-2 rounded-lg font-bold border border-blue-100">
                ID: <span id="label-id"></span>
            </div>
        </div>
        
        <!-- Kategori ISMI -->
        <div class="mb-10">
            <div class="flex items-center gap-2 mb-4">
                <div class="w-2 h-6 bg-blue-600 rounded-full"></div>
                <h2 class="text-xl font-bold text-slate-800">Kandidat ISMI <span class="text-sm font-normal text-slate-500">(Pilih 1)</span></h2>
            </div>
            <div id="ismi-list" class="flex flex-wrap justify-center gap-4 sm:gap-6"></div>
        </div>
        
        <!-- Kategori KGP -->
        <div class="mb-10">
            <div class="flex items-center gap-2 mb-4">
                <div class="w-2 h-6 bg-emerald-600 rounded-full"></div>
                <h2 class="text-xl font-bold text-slate-800">Kandidat KGP <span class="text-sm font-normal text-slate-500">(Pilih 1)</span></h2>
            </div>
            <div id="kgp-list" class="flex flex-wrap justify-center gap-4 sm:gap-6"></div>
        </div>

        <!-- Tombol Aksi -->
        <div class="flex flex-col sm:flex-row justify-end gap-3 pt-6 border-t border-slate-200 mt-8">
            <button onclick="logout()" class="px-6 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-lg transition-colors order-2 sm:order-1">
                Batal
            </button>
            <button id="btn-kirim" onclick="konfirmasiKirim()" disabled class="px-8 py-3 bg-blue-600 text-white font-bold rounded-lg transition-all opacity-50 cursor-not-allowed order-1 sm:order-2">
                Kirim Suara
            </button>
        </div>
    </div>

    <!-- HALAMAN ADMIN -->
    <div id="admin-section" class="hidden w-full max-w-4xl bg-white p-6 sm:p-8 rounded-2xl shadow-lg border border-slate-100 mx-4">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <h2 class="text-2xl font-bold text-slate-800">Panel Admin - Rekapan Suara (Bilik Ini)</h2>
            <button onclick="tutupAdmin()" class="px-4 py-2 bg-rose-100 text-rose-700 hover:bg-rose-200 font-bold rounded-lg transition-colors text-sm">
                Tutup Panel
            </button>
        </div>
        
        <div class="flex justify-end mb-6">
            <button onclick="exportExcel()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg transition-colors shadow-sm flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Export Excel (CSV)
            </button>
        </div>
        
        <div id="rekap-data"></div>
    </div>

    <!-- MODAL CUSTOM -->
    <div id="custom-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-white p-6 rounded-2xl shadow-2xl max-w-sm w-full transform transition-all" id="modal-content-area">
            <h3 id="modal-title" class="text-xl font-bold text-slate-800 mb-2"></h3>
            <p id="modal-desc" class="text-slate-600 mb-6 text-sm"></p>
            <input type="password" id="modal-input" class="hidden w-full p-3 mb-6 border border-slate-300 rounded-lg outline-none focus:border-blue-500 text-center tracking-widest" placeholder="Password Admin">
            <div id="modal-actions" class="flex gap-3 justify-end"></div>
        </div>
    </div>

<script>
    // KONFIGURASI SUPABASE (Sudah diatur sesuai data Anda)
    const supabaseUrl = 'https://qyqxtqewznjupclszxrz.supabase.co'; 
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF5cXh0cWV3em5qdXBjbHN6eHJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NjE3ODMsImV4cCI6MjEwNjAzNzc4M30.9eAx-q6I9lfTuKKsQk_Qe_xj64H5d5y7Xfm1XoH-Ed4'; 
    
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    const namaBilik = "Bilik 1"; 

    // ==========================================
    // DATA KANDIDAT PUTRA
    // ==========================================
    let k_ismi_pa = [
        { id: 'i1_pa', nama: "Faathir Muhamad Raihan", suara: 0, image: "Faathir.jpg.jpeg" },
        { id: 'i2_pa', nama: "Abyaz Rasha Afni Putra", suara: 0, image: "Abyaz.jpg.jpeg" },
        { id: 'i3_pa', nama: "Muhammad Azzam As Shiddiq Wibowo", suara: 0, image: "Azzam.jpg.jpeg" }
    ];
    let k_kgp_pa = [
        { id: 'k1_pa', nama: "Regan Habibullah Alfarisi", suara: 0, image: "Regan.jpg.jpeg" },
        { id: 'k2_pa', nama: "Muhammad Kemal Sajidsyah", suara: 0, image: "Kemal.jpg.jpeg" },
        { id: 'k3_pa', nama: "Aksan Hidayatullah", suara: 0, image: "Aksan.jpg.jpeg" }
    ];

    // ==========================================
    // DATA KANDIDAT PUTRI
    // ==========================================
    let k_ismi_pi = [
        { id: 'i1_pi', nama: "Nabila", suara: 0, image: "Nabila_ismi.jpeg" },
        { id: 'i2_pi', nama: "Nafeeza", suara: 0, image: "nafeeza_ismi.jpeg" },
        { id: 'i3_pi', nama: "Naurah", suara: 0, image: "Naurah_ismi.jpeg" }
    ];
    let k_kgp_pi = [
        { id: 'k1_pi', nama: "Dzakiyah", suara: 0, image: "Dzakiyah_kgp.jpeg" },
        { id: 'k2_pi', nama: "Putri", suara: 0, image: "Putri_kgp.jpeg" },
        { id: 'k3_pi', nama: "Rindi", suara: 0, image: "Rindi_kgp.jpeg" }
    ];
    
    let pemilih = Array.from({length: 200}, (_, i) => String(i+1).padStart(3, '0'));
    let idAktif = null;
    let genderAktif = null; // Menyimpan status apakah user memilih putra atau putri
    let pilIsmi = null;
    let pilKgp = null;

    function initData() {
        let sel = document.getElementById("voter-id");
        sel.innerHTML = '<option value="">-- Pilih ID Anda --</option>';
        pemilih.forEach(p => { sel.innerHTML += `<option value="${p}">${p}</option>`; });
        
        // Reset dropdown
        document.getElementById("kategori-gender").value = "";
    }

    function renderKandidat(elId, data, tipe) {
        const container = document.getElementById(elId);
        container.innerHTML = '';
        data.forEach(k => {
            const isSelected = (tipe === 'ismi' && pilIsmi === k.id) || (tipe === 'kgp' && pilKgp === k.id);
            const fallback = `https://ui-avatars.com/api/?name=${encodeURIComponent(k.nama)}&background=random&color=fff&size=128`;
            
            const html = `
                <div class="kandidat-card flex flex-col items-center p-4 border-2 rounded-xl cursor-pointer bg-white w-36 sm:w-40 border-slate-200 ${isSelected ? 'selected' : ''}" onclick="pilih('${tipe}', '${k.id}')">
                    <img src="${k.image}" onerror="this.onerror=null; this.src='${fallback}';" class="w-24 h-24 rounded-full object-cover object-top mb-3 shadow-sm border-2 border-slate-100" alt="${k.nama}">
                    <div class="text-sm font-semibold text-center text-slate-700 leading-tight">${k.nama}</div>
                </div>
            `;
            container.innerHTML += html;
        });
    }

    function pilih(tipe, id) {
        if(tipe === 'ismi') pilIsmi = id;
        if(tipe === 'kgp') pilKgp = id;
        
        // Render ulang berdasarkan gender yang sedang aktif
        const dataIsmi = genderAktif === 'putra' ? k_ismi_pa : k_ismi_pi;
        const dataKgp = genderAktif === 'putra' ? k_kgp_pa : k_kgp_pi;
        
        renderKandidat('ismi-list', dataIsmi, 'ismi');
        renderKandidat('kgp-list', dataKgp, 'kgp');
        
        const btn = document.getElementById("btn-kirim");
        if(pilIsmi && pilKgp) {
            btn.disabled = false;
            btn.classList.remove("opacity-50", "cursor-not-allowed");
            btn.classList.add("hover:bg-blue-700", "shadow-md");
        }
    }

    function login() {
        genderAktif = document.getElementById("kategori-gender").value;
        idAktif = document.getElementById("voter-id").value;
        
        if(!genderAktif) return showModal("Peringatan", "Silakan pilih Kategori Putra/Putri terlebih dahulu!", [{text: "Tutup", class: "bg-blue-600 text-white"}]);
        if(!idAktif) return showModal("Peringatan", "Silakan pilih ID Pemilih terlebih dahulu!", [{text: "Tutup", class: "bg-blue-600 text-white"}]);
        
        document.getElementById("label-id").innerText = idAktif;
        document.getElementById("subtitle-voting").innerText = `Kategori Pemilihan: Santri ${genderAktif === 'putra' ? 'Putra' : 'Putri'}`;
        
        document.getElementById("login-section").classList.add("hidden");
        document.getElementById("voting-section").classList.remove("hidden");
        
        pilIsmi = null; 
        pilKgp = null; 
        pilih(null, null); // Render list yang benar
    }

    function logout() {
        idAktif = null;
        genderAktif = null;
        document.getElementById("login-section").classList.remove("hidden");
        document.getElementById("voting-section").classList.add("hidden");
        initData();
    }

    function konfirmasiKirim() {
        showModal("Konfirmasi", "Yakin dengan pilihan Anda? Suara yang sudah dikirim tidak dapat diubah.", [
            {text: "Batal", class: "bg-slate-200 text-slate-800", action: closeModal},
            {text: "Ya, Kirim", class: "bg-blue-600 text-white", action: prosesKirimSuara}
        ]);
    }

    async function prosesKirimSuara() {
        // 1. Tentukan array mana yang di-update (Putra atau Putri)
        const active_k_ismi = genderAktif === 'putra' ? k_ismi_pa : k_ismi_pi;
        const active_k_kgp = genderAktif === 'putra' ? k_kgp_pa : k_kgp_pi;
        
        // 2. Simpan di Rekapan Lokal
        active_k_ismi.find(k => k.id === pilIsmi).suara++;
        active_k_kgp.find(k => k.id === pilKgp).suara++;
        pemilih = pemilih.filter(p => p !== idAktif);
        
        // Label Kategori untuk Supabase
        const labelIsmi = genderAktif === 'putra' ? 'ISMI Putra' : 'ISMI Putri';
        const labelKgp = genderAktif === 'putra' ? 'KGP Putra' : 'KGP Putri';

        // 3. Loading
        const modalContent = document.getElementById("modal-content-area");
        const originalHTML = modalContent.innerHTML;
        modalContent.innerHTML = `
            <div class="flex flex-col items-center justify-center py-6">
                <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-blue-600 mb-4"></div>
                <p class="font-bold text-slate-700 text-lg">Mengirim data ke pusat...</p>
                <p class="text-sm text-slate-500 mt-2">Mohon tunggu sebentar.</p>
            </div>
        `;

        // 4. Kirim ke Database Supabase
        try {
            const { error } = await supabaseClient
                .from('suara_pemilu')
                .insert([
                    { kandidat_id: pilIsmi, kategori: labelIsmi, bilik: namaBilik },
                    { kandidat_id: pilKgp, kategori: labelKgp, bilik: namaBilik }
                ]);

            if (error) throw error;

            modalContent.innerHTML = originalHTML;
            closeModal();
            setTimeout(() => {
                showModal("Berhasil!", "Terima kasih, suara Anda telah aman tersimpan di database pusat.", [
                    {text: "Tutup", class: "bg-emerald-600 text-white", action: () => { closeModal(); logout(); }}
                ]);
            }, 200);

        } catch (err) {
            console.error("Error Supabase:", err);
            modalContent.innerHTML = originalHTML; 
            closeModal();
            
            setTimeout(() => {
                showModal("Gagal Mengirim", "Gagal terhubung ke database pusat. Pastikan koneksi internet stabil.", [
                    {text: "Tutup", class: "bg-red-600 text-white", action: closeModal}
                ]);
            }, 200);
            
            // Rollback data lokal
            active_k_ismi.find(k => k.id === pilIsmi).suara--;
            active_k_kgp.find(k => k.id === pilKgp).suara--;
            pemilih.push(idAktif); 
            pemilih.sort(); 
        }
    }

    // -- FUNGSI ADMIN LOKAL --
    function bukaAdmin() {
        const inp = document.getElementById("modal-input");
        inp.classList.remove("hidden");
        inp.value = "";
        
        showModal("Login Admin", "Masukkan password untuk melihat rekapan bilik ini:", [
            {text: "Batal", class: "bg-slate-200 text-slate-800", action: () => { inp.classList.add("hidden"); closeModal(); }},
            {text: "Masuk", class: "bg-blue-600 text-white", action: () => {
                if(inp.value === "pengasuhan2026") {
                    inp.classList.add("hidden");
                    closeModal();
                    document.getElementById("login-section").classList.add("hidden");
                    document.getElementById("admin-section").classList.remove("hidden");
                    tampilRekap();
                } else {
                    alert("Password Salah!");
                }
            }}
        ]);
    }

    function tutupAdmin() {
        document.getElementById("admin-section").classList.add("hidden");
        document.getElementById("login-section").classList.remove("hidden");
    }

    function tampilRekap() {
        let h = `<h3 class="text-xl font-bold text-blue-600 mb-2 pb-1 border-b">Hasil ISMI (Putra)</h3>${buatTabel(k_ismi_pa)}
                 <h3 class="text-xl font-bold text-blue-400 mb-2 pb-1 border-b mt-6">Hasil ISMI (Putri)</h3>${buatTabel(k_ismi_pi)}
                 <h3 class="text-xl font-bold text-emerald-600 mb-2 pb-1 border-b mt-6">Hasil KGP (Putra)</h3>${buatTabel(k_kgp_pa)}
                 <h3 class="text-xl font-bold text-emerald-400 mb-2 pb-1 border-b mt-6">Hasil KGP (Putri)</h3>${buatTabel(k_kgp_pi)}
                 <div class="mt-6 p-4 bg-slate-50 border rounded-lg text-center"><p class="text-lg">Total Suara Masuk: <span class="text-blue-600 font-bold">${200 - pemilih.length}</span> / 200</p></div>`;
        document.getElementById("rekap-data").innerHTML = h;
    }

    function buatTabel(data) {
        let sorted = [...data].sort((a,b) => b.suara - a.suara);
        let t = `<div class="overflow-x-auto"><table class="w-full text-sm text-left"><thead class="bg-slate-100"><tr><th class="p-3">Posisi</th><th class="p-3">Nama</th><th class="p-3 text-center">Suara</th><th class="p-3">Jabatan</th></tr></thead><tbody>`;
        sorted.forEach((k, i) => {
            let jab = i === 0 ? '👑 Ketua' : (i === 1 ? '🥈 Wakil' : '-');
            t += `<tr class="border-b"><td class="p-3">${i+1}</td><td class="p-3 font-bold">${k.nama}</td><td class="p-3 text-center font-bold text-blue-600">${k.suara}</td><td class="p-3">${jab}</td></tr>`;
        });
        return t + "</tbody></table></div>";
    }

    function exportExcel() {
        let csv = "Kategori,Posisi,Nama,Suara,Jabatan\n";
        let isiCSV = (data, kat) => {
            [...data].sort((a,b) => b.suara - a.suara).forEach((k, i) => {
                csv += `${kat},${i+1},${k.nama},${k.suara},${i === 0 ? "Ketua" : (i === 1 ? "Wakil" : "-")}\n`;
            });
        };
        isiCSV(k_ismi_pa, "ISMI Putra"); 
        isiCSV(k_ismi_pi, "ISMI Putri"); 
        isiCSV(k_kgp_pa, "KGP Putra");
        isiCSV(k_kgp_pi, "KGP Putri");
        let a = document.createElement("a");
        a.href = "data:text/csv;charset=utf-8," + encodeURIComponent(csv);
        a.download = `Rekapan_Lokal_${namaBilik}_DaarElQolam.csv`;
        a.click();
    }

    const modal = document.getElementById("custom-modal");
    function showModal(title, desc, buttons) {
        document.getElementById("modal-title").innerText = title;
        document.getElementById("modal-desc").innerText = desc;
        
        const actions = document.getElementById("modal-actions");
        actions.innerHTML = '';
        if(buttons) {
            buttons.forEach(b => {
                const btn = document.createElement("button");
                btn.className = `px-4 py-2 font-bold rounded-lg transition-colors w-full ${b.class}`;
                btn.innerText = b.text;
                btn.onclick = b.action || closeModal;
                actions.appendChild(btn);
            });
        }
        modal.classList.remove("hidden");
    }
    function closeModal() { modal.classList.add("hidden"); }

    window.onload = initData;
</script>
</body>
</html>
